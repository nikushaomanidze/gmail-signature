<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<title>Gmail signature</title>
</head>
<body style="margin:40px; background:#ffffff;">

<p style="font-family:Arial, sans-serif; font-size:15px; color:#888;">
  დააჭირე ღილაკს Copy signature და ჩასვი Gmail-ის ხელმოწერის ველში (Ctrl/Cmd + V).

<span id="copyMsg" style="font-family:Arial, sans-serif; font-size:14px; color:#16A34A; margin-left:10px;"></span>

<div id="sig">

      <div style="font-family:Arial, Helvetica, sans-serif; font-size:13px; line-height:20px; letter-spacing:0.3px; color:#E4E6F0; margin-top:8px;">
        <a href="tel:+995591446365" style="color:#E4E6F0; text-decoration:none; font-family:Arial, Helvetica, sans-serif;"><span style="color:#E4E6F0; text-decoration:none; font-family:Arial, Helvetica, sans-serif;">+995 591 446 365</span></a><br>
        <a href="mailto:omanidze.nika@gmail.com" style="color:#E4E6F0; text-decoration:none; font-family:Arial, Helvetica, sans-serif;"><span style="color:#E4E6F0; text-decoration:none; font-family:Arial, Helvetica, sans-serif;">omanidze.nika@gmail.com</span></a><br>

    </td>
    <td width="140" height="150" style="width:118px; height:150px; background:#1F2544; padding:0 22px 0 0; vertical-align:middle; text-align:right; font-family:Georgia, 'Times New Roman', serif;">

  <tr>
    <td colspan="2" height="30" style="height:30px; background:#E9EAF0; font-size:0; line-height:0;">&nbsp;</td>
  </tr>
</table>
<!-- SIGNATURE END -->
</div>

<script>
function copySig() {
  var el = document.getElementById("sig");
  var range = document.createRange();
  range.selectNodeContents(el);
  var sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  var ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  sel.removeAllRanges();
  document.getElementById("copyMsg").textContent = ok
    ? "Copied. Now paste it in Gmail (Ctrl/Cmd + V)."
    : "Copy failed. Select the signature with the mouse and press Ctrl/Cmd + C.";
}
</script>

</body>
